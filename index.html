<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazenstein</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060918;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh;overflow-x:hidden}

.phone{
  width:100%;max-width:430px;height:100vh;height:100dvh;background:#07091A;
  border-radius:0;border:none;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:none;
}
@media(min-width:500px){
  .phone{width:390px;height:844px;border-radius:48px;border:1px solid rgba(108,71,255,0.25);box-shadow:0 0 0 1px rgba(0,0,0,0.9),0 40px 80px rgba(0,0,0,0.8),0 0 100px rgba(108,71,255,0.08);}
  body{align-items:center}
}

/* orbs */
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:orbF 9s ease-in-out infinite}
@keyframes orbF{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}

/* status */
.status{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;font-size:12px;font-weight:600;color:rgba(255,255,255,0.8);position:relative;z-index:3;flex-shrink:0}

/* screens */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;position:relative;z-index:2}
.screen.active{display:flex}

/* ── MAIN SCREEN ── */
.main-top{text-align:center;padding:10px 24px 14px;flex-shrink:0}
.main-logo{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(108,71,255,0.6);font-weight:600;margin-bottom:6px}
.main-greeting{font-size:20px;font-weight:500;color:rgba(255,255,255,0.88);margin-bottom:4px}
.main-sub{font-size:12px;color:rgba(255,255,255,0.35)}

/* capture row */
.capture-wrap{margin:0 16px;flex-shrink:0}
.capture-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(108,71,255,0.35);
  border-radius:18px;padding:12px 14px;
  transition:border-color 0.2s;
}
.capture-row:focus-within{border-color:rgba(108,71,255,0.65);box-shadow:0 0 20px rgba(108,71,255,0.1)}
.cap-star{flex-shrink:0}
.cap-input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:15px;color:rgba(255,255,255,0.82);font-family:'Inter',sans-serif;
  line-height:1.5;resize:none;min-height:24px;max-height:50dvh;overflow-y:auto;
}
.cap-input::placeholder{color:rgba(255,255,255,0.22)}
.cap-mic{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.06);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.cap-mic:hover{background:rgba(108,71,255,0.15)}
.cap-mic.recording{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.5);box-shadow:0 0 14px rgba(0,212,255,0.3);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 14px rgba(0,212,255,0.3)}50%{box-shadow:0 0 24px rgba(0,212,255,0.6)}}
.cap-clear{
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.06);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;color:rgba(255,255,255,0.4);
  font-size:16px;line-height:1;
}
.cap-clear.show{display:flex}
.cap-clear:hover{background:rgba(255,80,80,0.15);color:rgba(255,100,100,0.8)}
.cap-send{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(108,71,255,0.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.cap-send:hover{background:rgba(108,71,255,0.45);box-shadow:0 0 16px rgba(108,71,255,0.4)}
.cap-send:active{transform:scale(0.92)}

/* status text under field */
.cap-status{font-size:11px;color:rgba(0,212,255,0.7);text-align:center;margin-top:7px;min-height:16px;transition:opacity 0.3s}

/* quick tags */
.qtags{display:flex;gap:8px;justify-content:center;padding:10px 16px 0;flex-shrink:0;flex-wrap:wrap}
.qtag{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 14px;border-radius:16px;
  border:0.5px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.03);
  cursor:pointer;transition:all 0.2s;min-width:72px;
  font-family:'Inter',sans-serif;
}
.qtag:hover{background:rgba(108,71,255,0.08);border-color:rgba(108,71,255,0.2)}
.qtag-icon{font-size:20px}
.qtag-label{font-size:10px;color:rgba(255,255,255,0.4);font-weight:500}

/* big chaos button */
.chaos-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;min-height:0;max-height:320px;
}
.chaos-glow{
  position:absolute;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(108,71,255,0.22) 0%,rgba(0,212,255,0.06) 55%,transparent 70%);
  filter:blur(24px);pointer-events:none;
  animation:glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

.chaos-rings{position:absolute;width:140px;height:140px}
.cring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(108,71,255,0.1);transform:translate(-50%,-50%);animation:rexp 3s ease-out infinite}
.cring:nth-child(1){width:160px;height:160px;animation-delay:0s}
.cring:nth-child(2){width:195px;height:195px;animation-delay:1s}
.cring:nth-child(3){width:230px;height:230px;animation-delay:2s}
@keyframes rexp{0%{opacity:0.45;transform:translate(-50%,-50%) scale(0.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* wave lines like on reference */
.wave-left,.wave-right{
  position:absolute;top:50%;width:90px;height:60px;
  pointer-events:none;opacity:0.6;
}
.wave-left{left:0;transform:translateY(-50%)}
.wave-right{right:0;transform:translateY(-50%) scaleX(-1)}

.chaos-btn{
  width:130px;height:130px;border-radius:50%;
  border:none;background:transparent;cursor:pointer;
  padding:0;position:relative;z-index:2;
  transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.chaos-btn:hover{transform:scale(1.06)}
.chaos-btn:active{transform:scale(0.94)}

/* flower petals like reference */
.chaos-petals{
  position:absolute;inset:0;border-radius:50%;
  animation:petalSpin 8s linear infinite;
}
@keyframes petalSpin{to{transform:rotate(360deg)}}

.chaos-outer{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#6C47FF,#A855F7,#00D4FF,#6C47FF);
  animation:spinOuter 6s linear infinite;
  filter:blur(1px);
}
@keyframes spinOuter{to{transform:rotate(360deg)}}

.chaos-mid{
  position:absolute;inset:6px;border-radius:50%;
  background:linear-gradient(145deg,#1a0d40,#090618);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 40px rgba(108,71,255,0.3),inset 0 0 80px rgba(0,212,255,0.05);
}

/* inner decorative rings */
.chaos-mid::before{
  content:'';position:absolute;inset:10px;border-radius:50%;
  border:1px solid rgba(108,71,255,0.2);
}
.chaos-mid::after{
  content:'';position:absolute;inset:20px;border-radius:50%;
  border:1px solid rgba(0,212,255,0.15);
}

.chaos-icon{position:relative;z-index:1}

.chaos-hint{margin-top:14px;text-align:center;position:relative;z-index:2}
.chaos-hint-tap{font-size:13px;color:rgba(255,255,255,0.55)}
.chaos-hint-voice{font-size:13px;color:#00D4FF;font-weight:500;margin-top:2px}

/* save feedback */
.save-flash{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(108,71,255,0.9);color:white;
  padding:10px 24px;border-radius:99px;font-size:14px;font-weight:500;
  pointer-events:none;opacity:0;transition:opacity 0.3s;
  backdrop-filter:blur(10px);white-space:nowrap;z-index:10;
}
.save-flash.show{opacity:1}

/* ── HISTORY SCREEN ── */
.hist-header{padding:16px 20px 12px;flex-shrink:0}
.hist-title{font-size:22px;font-weight:600;color:rgba(255,255,255,0.9);letter-spacing:-0.3px}
.hist-sub{font-size:12px;color:rgba(255,255,255,0.3);margin-top:3px}

.hist-search{
  margin:0 16px 12px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:9px 13px;flex-shrink:0;
}
.hist-search input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif}
.hist-search input::placeholder{color:rgba(255,255,255,0.22)}

.hist-list{flex:1;overflow-y:auto;padding:0 16px 12px}
.hist-list::-webkit-scrollbar{width:0}

.hist-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.25);font-size:14px}
.hist-empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4}

.note-card{
  background:rgba(255,255,255,0.03);
  border:0.5px solid rgba(255,255,255,0.07);
  border-radius:16px;padding:13px 15px;margin-bottom:8px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:all 0.2s;
}
.note-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(108,71,255,0.2)}
.note-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(to bottom,#6C47FF,#00D4FF);border-radius:99px;
  opacity:0.6;
}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.note-date{font-size:10px;color:rgba(255,255,255,0.28);font-weight:500}
.note-type{font-size:9px;padding:2px 7px;border-radius:99px;font-weight:600}
.type-voice{background:rgba(0,212,255,0.1);color:rgba(0,212,255,0.8);border:0.5px solid rgba(0,212,255,0.2)}
.type-text{background:rgba(108,71,255,0.1);color:rgba(139,92,246,0.8);border:0.5px solid rgba(108,71,255,0.2)}
.note-text{font-size:13.5px;color:rgba(255,255,255,0.72);line-height:1.5;word-break:break-word}
.note-actions{display:flex;gap:8px;margin-top:10px;opacity:1;}

.note-btn{
  font-size:11px;padding:4px 12px;border-radius:99px;border:none;
  cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all 0.2s;
}
.note-edit{background:rgba(108,71,255,0.15);color:rgba(139,92,246,0.9)}
.note-edit:hover{background:rgba(108,71,255,0.3)}
.note-done{background:rgba(0,200,100,0.12);color:rgba(0,220,110,0.85);border:0.5px solid rgba(0,200,100,0.25)}
.note-done:hover{background:rgba(0,200,100,0.25)}
.note-undone{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:0.5px solid rgba(255,255,255,0.1)}
.note-undone:hover{background:rgba(255,255,255,0.1)}
.note-del{background:rgba(255,80,80,0.1);color:rgba(255,100,100,0.8)}
.note-del:hover{background:rgba(255,80,80,0.25)}

/* edit modal */
.modal-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(5,8,20,0.85);backdrop-filter:blur(10px);
  z-index:20;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:#0F1228;border:0.5px solid rgba(108,71,255,0.3);
  border-radius:24px;padding:20px;width:100%;
  box-shadow:0 0 60px rgba(108,71,255,0.15);
}
.modal-title{font-size:16px;font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:14px}
.modal-textarea{
  width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:13px;color:rgba(255,255,255,0.82);
  font-size:14px;font-family:'Inter',sans-serif;line-height:1.55;
  resize:none;outline:none;min-height:120px;
}
.modal-textarea:focus{border-color:rgba(108,71,255,0.4)}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-cancel{flex:1;padding:10px;border-radius:12px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.45);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.modal-save{flex:1;padding:10px;border-radius:12px;border:0.5px solid rgba(108,71,255,0.4);background:rgba(108,71,255,0.2);color:rgba(139,92,246,0.95);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.modal-save:hover{background:rgba(108,71,255,0.4);color:#fff}

/* ── DOCK ── */
.dock{
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 20px 26px;
  background:rgba(255,255,255,0.02);
  border-top:0.5px solid rgba(255,255,255,0.06);
  flex-shrink:0;position:relative;z-index:3;
}
.dock-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;padding:7px 18px;border-radius:16px;
  background:transparent;border:none;font-family:'Inter',sans-serif;
  position:relative;transition:all 0.2s;
}
.dock-item svg{width:24px;height:24px;color:rgba(255,255,255,0.28);transition:all 0.2s}
.dock-item span{font-size:10px;color:rgba(255,255,255,0.22);font-weight:500;transition:all 0.2s}
.dock-item.active svg{color:#8B5CF6;filter:drop-shadow(0 0 6px rgba(108,71,255,0.8))}
.dock-item.active span{color:rgba(139,92,246,0.75)}
.dock-item.active::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#6C47FF;box-shadow:0 0 6px #6C47FF}

/* ── CHAT SCREEN ── */
.chat-header{padding:16px 20px 10px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6C47FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-title-wrap{flex:1}
.chat-title{font-size:16px;font-weight:600;color:rgba(255,255,255,0.9)}
.chat-subtitle{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}
.chat-clear-btn{padding:5px 12px;border-radius:99px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.chat-clear-btn:hover{border-color:rgba(255,80,80,0.3);color:rgba(255,100,100,0.6)}

.chat-messages{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.chat-messages::-webkit-scrollbar{width:0}

.chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;word-break:break-word;position:relative}
.bubble-user{align-self:flex-end;background:rgba(108,71,255,0.25);border:0.5px solid rgba(108,71,255,0.35);color:rgba(255,255,255,0.88);border-bottom-right-radius:5px}
.bubble-ai{align-self:flex-start;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.8);border-bottom-left-radius:5px}
.bubble-time{font-size:9px;color:rgba(255,255,255,0.25);margin-top:5px;text-align:right}
.bubble-ai .bubble-time{text-align:left}

.bubble-confirm{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.confirm-btn{padding:5px 13px;border-radius:99px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;transition:all 0.2s}
.confirm-yes{background:rgba(108,71,255,0.3);color:rgba(139,92,246,0.95);border:0.5px solid rgba(108,71,255,0.4)}
.confirm-yes:hover{background:rgba(108,71,255,0.5)}
.confirm-no{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);border:0.5px solid rgba(255,255,255,0.1)}
.confirm-no:hover{background:rgba(255,80,80,0.12);color:rgba(255,100,100,0.7)}

.bubble-typing{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:rgba(108,71,255,0.6);animation:typingBounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.chat-input-wrap{padding:10px 16px 14px;flex-shrink:0;border-top:0.5px solid rgba(255,255,255,0.06)}
.chat-input-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(108,71,255,0.3);border-radius:18px;padding:10px 12px;transition:border-color 0.2s}
.chat-input-row:focus-within{border-color:rgba(108,71,255,0.6)}
.chat-textarea{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:rgba(255,255,255,0.82);font-family:'Inter',sans-serif;line-height:1.5;resize:none;min-height:22px;max-height:120px;overflow-y:auto}
.chat-textarea::placeholder{color:rgba(255,255,255,0.22)}
.chat-mic-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.06);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.chat-mic-btn:hover{background:rgba(108,71,255,0.15)}
.chat-mic-btn.recording{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.5);animation:micPulse 1s ease-in-out infinite}
.chat-send-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(108,71,255,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.chat-send-btn:hover{background:rgba(108,71,255,0.45)}
.chat-send-btn:active{transform:scale(0.92)}
</style>
</head>
<body>

<div class="phone" id="phone">
  <!-- orbs -->
  <div class="orb" style="width:300px;height:300px;background:rgba(108,71,255,0.2);top:-90px;left:-80px;animation-delay:0s"></div>
  <div class="orb" style="width:240px;height:240px;background:rgba(0,212,255,0.11);top:280px;right:-80px;animation-delay:-4s"></div>
  <div class="orb" style="width:190px;height:190px;background:rgba(168,85,247,0.14);bottom:140px;left:-20px;animation-delay:-6.5s"></div>

  <!-- Status -->
  <div class="status">
    <span id="clock">--:--</span>
    <span style="font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(108,71,255,0.65);font-weight:600">Hazenstein</span>
    <span></span>
  </div>

  <!-- ── MAIN SCREEN ── -->
  <div class="screen active" id="screen-main">
    <div class="main-top">
      <div class="main-greeting">Привет, Алексей</div>
      <div class="main-sub">Ты — архитектор своей реальности.</div>
    </div>

    <!-- Capture row -->
    <div class="capture-wrap">
      <div class="capture-row">
        <svg class="cap-star" width="18" height="18" viewBox="0 0 24 24" fill="rgba(108,71,255,0.7)">
          <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z"/>
        </svg>
        <textarea class="cap-input" id="cap-input" placeholder="Capture thoughts or wishes..." rows="1"></textarea>
        <button class="cap-clear" id="cap-clear" title="Очистить">✕</button>
        <button class="cap-mic" id="cap-mic" title="Голосовой ввод">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

let customPromptAddition = ''; // дополнение к промпту из базы

async function loadCustomPrompt() {
  try {
    const snap = await getDocs(settingsCol);
    const doc_ = snap.docs.find(d => d.id === 'ai_prompt');
    if (doc_) customPromptAddition = doc_.data().addition || '';
  } catch {}

async function saveCustomPrompt(text) {
  try {
    const snap = await getDocs(settingsCol);
    const existing = snap.docs.find(d => d.id === 'ai_prompt');
    if (existing) {
      await updateDoc(doc(db, 'settings', 'ai_prompt'), { addition: text });
    } else {
      await addDoc(settingsCol, { addition: text });
    }
    customPromptAddition = text;
  } catch(e) { console.error('prompt save error', e); }
}

let notes = [];
let editingId = null;
let activeTag = null;

// ── РЕЧЬ ──
let recognition = null;
let isRecording = false;
let accumulated = ''; // финальный накопленный текст

function getSR() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}

function createRecognition() {
  const SR = getSR();
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ru-RU';
  r.continuous = false;      // без continuous — нет дублей и нет потери пробелов
  r.interimResults = true;

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const chunk = e.results[i][0].transcript.trim();
        if (chunk) {
          accumulated = accumulated ? accumulated + ' ' + chunk : chunk;
        }
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const display = accumulated + (interim ? (accumulated ? ' ' : '') + interim : '');
    document.getElementById('cap-input').value = display;
    autoResize();
    showClear();
  };

  r.onend = () => {
    // автоперезапуск, пока пользователь не нажал стоп
    if (isRecording) {
      try { recognition.start(); } catch(err) {}
    }
  };

  r.onerror = (e) => {
    if (e.error === 'aborted') return;
    if (e.error === 'no-speech') return; // тихо — просто ждём
    stopRecording();
  };

  return r;
}

function startRecording() {
  if (!getSR()) { setStatus('Голосовой ввод не поддерживается'); return; }

  accumulated = '';
  document.getElementById('cap-input').value = '';
  autoResize();

  recognition = createRecognition();
  if (!recognition) return;

  isRecording = true;
  setMicState(true);
  setStatus('🎤 Говорите...');
  try { recognition.start(); } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  setMicState(false);
  setStatus('');
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
    // небольшая пауза чтобы финальный результат успел записаться в поле
    setTimeout(() => {
      const text = document.getElementById('cap-input').value.trim();
      if (text) saveNote(text, 'voice');
    }, 150);
  } else {
    startRecording();
  }
}

function setMicState(on) {
  const mic = document.getElementById('cap-mic');
  const chaos = document.getElementById('chaos-btn');
  if (on) {
    mic.classList.add('recording');
    chaos.style.filter = 'drop-shadow(0 0 20px rgba(0,212,255,0.9))';
  } else {
    mic.classList.remove('recording');
    chaos.style.filter = '';
  }
}

// ── UI ──
function setStatus(txt) {
  const el = document.getElementById('cap-status');
  el.textContent = txt;
  el.style.opacity = txt ? '1' : '0';
}

function autoResize() {
  const ta = document.getElementById('cap-input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.5) + 'px';
}

function showClear() {
  const val = document.getElementById('cap-input').value;
  document.getElementById('cap-clear').classList.toggle('show', val.length > 0);
}

function flashSaved() {
  const el = document.getElementById('save-flash');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function setTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  document.querySelectorAll('.qtag').forEach(b => {
    const isActive = b.querySelector('.qtag-label').textContent === activeTag;
    b.style.borderColor = isActive ? 'rgba(108,71,255,0.5)' : '';
    b.style.background = isActive ? 'rgba(108,71,255,0.12)' : '';
  });
}
window.setTag = setTag;

// ── СОХРАНЕНИЕ ──
async function saveNote(text, type) {
  if (!text.trim()) return;
  try {
    await addDoc(notesCol, {
      text: text.trim(),
      type: type || 'text',
      tag: activeTag || null,
      createdAt: new Date().toISOString()
    });
    document.getElementById('cap-input').value = '';
    document.getElementById('cap-input').style.height = 'auto';
    showClear();
    activeTag = null;
    document.querySelectorAll('.qtag').forEach(b => { b.style.borderColor=''; b.style.background=''; });
    flashSaved();
    await loadNotes();
  } catch(e) {
    setStatus('Ошибка: ' + e.message);
  }
}

// ── ЗАГРУЗКА ──
async function loadNotes() {
  try {
    const q = query(notesCol, orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNotes(notes);
  } catch(e) {
    document.getElementById('hist-list').innerHTML = '<div class="hist-empty"><div>⚠️</div>Ошибка загрузки</div>';
  }
}

function renderNotes(list) {
  const el = document.getElementById('hist-list');
  document.getElementById('hist-count').textContent = list.length + ' записей';
  if (!list.length) {
    el.innerHTML = '<div class="hist-empty"><div class="hist-empty-icon">📭</div>Пока нет записей</div>';
    return;
  }
  el.innerHTML = list.map(n => {
    // UTC+3 Moscow time
    const d = new Date(new Date(n.createdAt).getTime() + 3*60*60*1000);
    const date = d.toLocaleDateString('ru-RU', { day:'numeric', month:'short', timeZone:'UTC' });
    const time = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' });
    const isDone = n.done === true;
    const isTask = n.tag === 'Задача';
    const cardStyle = isDone ? 'opacity:0.5;' : '';
    const textStyle = isDone ? 'text-decoration:line-through;color:rgba(255,255,255,0.4);' : '';
    const doneBtn = isTask ? `<button class="note-btn ${isDone ? 'note-undone' : 'note-done'}" onclick="toggleDone('${n.id}', ${isDone})">${isDone ? '↩ Открыть' : '✓ Выполнено'}</button>` : '';
    return `
      <div class="note-card" style="${cardStyle}">
        <div class="note-meta">
          <span class="note-date">${date} · ${time}${n.tag ? ' · ' + n.tag : ''}</span>
          <span class="note-type ${n.type === 'voice' ? 'type-voice' : 'type-text'}">${n.type === 'voice' ? '🎤 Голос' : '✏️ Текст'}</span>
        </div>
        <div class="note-text" style="${textStyle}">${escHtml(n.text)}</div>
        <div class="note-actions">
          ${doneBtn}
          <button class="note-btn note-edit" onclick="openEdit('${n.id}')">Редактировать</button>
          <button class="note-btn note-del" onclick="deleteNote('${n.id}')">Удалить</button>
        </div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function filterNotes() {
  const q = document.getElementById('hist-search').value.toLowerCase();
  renderNotes(q ? notes.filter(n => n.text.toLowerCase().includes(q)) : notes);
}
window.filterNotes = filterNotes;

function openEdit(id) {
  editingId = id;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  document.getElementById('modal-text').value = n.text;
  document.getElementById('modal').classList.add('open');
}
window.openEdit = openEdit;

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}
window.closeModal = closeModal;

async function saveEdit() {
  const text = document.getElementById('modal-text').value.trim();
  if (!text || !editingId) return;

    await updateDoc(doc(db, 'notes', editingId), { text });

    await loadNotes();

}
window.saveEdit = saveEdit;

async function deleteNote(id) {
  if (!confirm('Удалить запись?')) return;
  try {
    await deleteDoc(doc(db, 'notes', id));
    await loadNotes();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
window.deleteNote = deleteNote;

async function toggleDone(id, currentDone) {
  try {
    await updateDoc(doc(db, 'notes', id), { done: !currentDone });
    await loadNotes();
  } catch(e) { alert('Ошибка: ' + e.message); }

window.toggleDone = toggleDone;

// экспорт чата
window.exportChat = async function() {
  try {
    const q = query(chatCol, orderBy('time', 'asc'));
    const snap = await getDocs(q);
    const data = snap.docs.map(d => d.data());
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hazenstein_chat_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('Ошибка экспорта: ' + e.message); }
};

document.getElementById('cap-input').addEventListener('input', () => { autoResize(); showClear(); });

let chatHistory = [];

let isChatRecording = false;
let chatAccumulated = '';

async function loadChatHistory() {
  try {
    const q = query(chatCol, orderBy('time', 'asc'));

async function saveChatMessage(msg) {

    const docRef = await addDoc(chatCol, msg);

  } catch(e) { console.error('chat save error', e); }
}

async function deleteChatHistory() {
  try {
    const snap = await getDocs(chatCol);
    await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'chat', d.id))));
  } catch {}
}

function escHtmlChat(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function renderChat() {
  const el = document.getElementById('chat-messages');
  if (!el) return;
  el.innerHTML = chatHistory.map((m, i) => {
    if (m.role === 'system') return '';
    const isUser = m.role === 'user';
    const time = m.time ? new Date(new Date(m.time).getTime()+3*60*60*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'}) : '';
    let confirmHtml = '';
    if (m.confirmData && !m.confirmData.resolved) {
      confirmHtml = `<div class="bubble-confirm">
        <button class="confirm-btn confirm-yes" onclick="resolveConfirm(${i},true)">✓ Да, добавить</button>
        <button class="confirm-btn confirm-no" onclick="resolveConfirm(${i},false)">✗ Нет</button>
      </div>`;
    }
    return `<div class="chat-bubble ${isUser?'bubble-user':'bubble-ai'}">
      ${escHtmlChat(m.content)}${confirmHtml}
      <div class="bubble-time">${time}</div>
    </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

window.resolveConfirm = async function(idx, yes) {
  const m = chatHistory[idx];
  if (!m || !m.confirmData) return;
  m.confirmData.resolved = true;
  if (m.id) {
    try { await updateDoc(doc(db,'chat',m.id), {confirmData: m.confirmData}); } catch {}
  }
  if (yes) {
    const nd = m.confirmData.note;
    try {
      await addDoc(notesCol, {
        text: nd.text, type: 'text',
        tag: nd.tag || null,
        createdAt: new Date().toISOString()
      });
      await addChatMessage('assistant', '✅ Добавлено в базу!');
      await loadNotes();
    } catch(e) { await addChatMessage('assistant', 'Ошибка: ' + e.message); }
  } else {
    await addChatMessage('assistant', 'Хорошо, ничего не добавляю.');
  }
  renderChat();
};

async function addChatMessage(role, content, confirmData) {
  const msg = { role, content, time: new Date().toISOString() };
  if (confirmData) msg.confirmData = confirmData;
  chatHistory.push(msg);
  await saveChatMessage(msg);
  renderChat();
}

function showTyping() {
  const el = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-bubble bubble-ai';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="bubble-typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function toMoscow(isoStr) {
  const d = new Date(isoStr);
  // UTC+3
  d.setTime(d.getTime() + 3 * 60 * 60 * 1000);
  const day = String(d.getUTCDate()).padStart(2,'0');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const mon = months[d.getUTCMonth()];
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  return `${day} ${mon} ${h}:${m}`;
}

function buildSystemPrompt() {
  const now = new Date();
  now.setTime(now.getTime() + 3 * 60 * 60 * 1000);
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const todayStr = `${days[now.getUTCDay()]}, ${now.getUTCDate()} ${months[now.getUTCMonth()]} ${now.getUTCFullYear()}, ${String(now.getUTCHours()).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')} (МСК)`;

  const notesContext = notes.slice(0,100).map(n => {
    return `[${toMoscow(n.createdAt)} МСК${n.tag?' | '+n.tag:''}] ${n.text}`;
  }).join('\n');

  return `Ты — личный ИИ-ассистент Алексея в приложении Hazenstein. Сейчас: ${todayStr}.

БАЗА ДАННЫХ (все записи, время московское):
${notesContext||'(пока пусто)'}

ПРАВИЛА:

1. ВОПРОСЫ О БАЗЕ — отвечай точно используя время из базы. Для подсчётов (сколько таксовал, сколько заработал) — ищи пары «начал/закончил» по времени записи.

2. САММАРИ ДНЯ — когда просят «что было сегодня» или «итоги дня»: группируй по категориям, считай время и деньги если есть, перечисли выполненные и невыполненные задачи.

3. ПРОВЕРКА ЗАДАЧ — если в базе есть задачи с тегом «Задача» без done:true, периодически спрашивай «Ты сделал X?». Если пользователь отвечает «да» или «сделал» — используй [ВЫПОЛНЕНО: id_задачи] для пометки. Если id неизвестен — [ВЫПОЛНЕНО: текст задачи].

4. ДОБАВЛЕНИЕ В БАЗУ — спрашивай «Добавить в базу?» и используй [ДОБАВИТЬ: текст | тег] ТОЛЬКО когда пользователь говорит о конкретном действии которое надо сделать, ставит задачу на будущее, формулирует цель или намерение. НЕ спрашивай если: просто болтает, задаёт вопрос, отвечает «да/нет».

5. ОБНОВЛЕНИЕ ПРОМПТА — если пользователь говорит «запомни», «обучись», «добавь в промпт» — используй [ПРОМПТ: новое правило или инструкция]. Это сохранится в базе и будет использоваться всегда.

6. ТЕГИ: Задача, Цель, Идея, Дневник, Такси, Напоминание.

${customPromptAddition ? '7. ДОПОЛНИТЕЛЬНЫЕ ИНСТРУКЦИИ ОТ ПОЛЬЗОВАТЕЛЯ:\n' + customPromptAddition : ''}

Отвечай кратко, по-русски, дружелюбно. Не пересказывай базу целиком.`;
}

async function sendChatMessage(userText) {
  if (!userText.trim()) return;
  await addChatMessage('user', userText);
  const apiMessages = [
    { role:'system', content: buildSystemPrompt() },
    ...chatHistory.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,content:m.content}))
  ];
  showTyping();
  document.getElementById('chat-subtitle').textContent = 'Думаю...';
  try {
    const res = await fetch(POLZA_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+POLZA_KEY},
      body: JSON.stringify({model:CHAT_MODEL, max_tokens:700, messages:apiMessages})
    });
    const data = await res.json();
    hideTyping();
    document.getElementById('chat-subtitle').textContent = 'Готов помочь';
    const reply = data.choices?.[0]?.message?.content || 'Нет ответа';

    // обрабатываем все команды в ответе
    let cleanReply = reply;

    // [ПРОМПТ: ...]
    const promptMatch = reply.match(/\[ПРОМПТ:\s*(.+?)\]/s);
    if (promptMatch) {
      const newRule = promptMatch[1].trim();
      const updated = customPromptAddition ? customPromptAddition + '\n' + newRule : newRule;
      await saveCustomPrompt(updated);
      cleanReply = cleanReply.replace(promptMatch[0], '').trim();
    }

    // [ВЫПОЛНЕНО: ...]
    const doneMatch = reply.match(/\[ВЫПОЛНЕНО:\s*(.+?)\]/);
    if (doneMatch) {
      const target = doneMatch[1].trim();
      // ищем задачу по тексту
      const task = notes.find(n => n.tag === 'Задача' && n.text.toLowerCase().includes(target.toLowerCase()) && !n.done);
      if (task) {
        await updateDoc(doc(db, 'notes', task.id), { done: true });
        await loadNotes();
      }
      cleanReply = cleanReply.replace(doneMatch[0], '').trim();
    }

    // [ДОБАВИТЬ: ...]
    const addMatch = cleanReply.match(/\[ДОБАВИТЬ:\s*(.+?)(?:\s*\|\s*(\w+))?\]/);
    if (addMatch) {
      const noteText = addMatch[1].trim();
      const noteTag = addMatch[2]?.trim() || null;
      cleanReply = cleanReply.replace(addMatch[0], '').trim();
      await addChatMessage('assistant', cleanReply + (cleanReply ? '\n\n' : '') + 'Добавить в базу: «'+noteText+'»?',
        {note:{text:noteText,tag:noteTag},resolved:false});
    } else {
      await addChatMessage('assistant', cleanReply || reply);
    }
  } catch(e) {
    hideTyping();
    document.getElementById('chat-subtitle').textContent = 'Готов помочь';
    await addChatMessage('assistant','Ошибка соединения: '+e.message);
  }
}

function checkRemindersOnOpen() {
  if (!notes.length) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = notes.filter(n => {
    if (n.tag!=='Reminder') return false;
    const dm = n.text.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/);
    if (!dm) return false;
    const year = dm[3]?parseInt(dm[3]):today.getFullYear();
    const d = new Date(year, parseInt(dm[2])-1, parseInt(dm[1]));
    d.setHours(0,0,0,0);
    return d<=today;
  });
  if (due.length>0) {
    addChatMessage('assistant','⏰ Привет! Напоминания на сегодня:\n\n'+due.map(r=>'• '+r.text).join('\n'));
  } else if (chatHistory.length===0) {
    addChatMessage('assistant','Привет, Алексей! 👋 Спроси меня что угодно — покажу что в базе, помогу разобрать записи или поставить задачу.');
  }
}

window.clearChatHistory = async function() {
  if (!confirm('Очистить историю чата?')) return;
  await deleteChatHistory();
  chatHistory = [];
  renderChat();
};

// экспорт заметок
window.exportNotes = async function() {
  try {
    const q = query(notesCol, orderBy('createdAt','asc'));
    const snap = await getDocs(q);
    const data = snap.docs.map(d => d.data());
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hazenstein_notes_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('Ошибка экспорта: ' + e.message); }
};

// голос в чате
function createChatRecognition() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang='ru-RU'; r.continuous=false; r.interimResults=true;
  r.onresult = (e) => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      if (e.results[i].isFinal) { const c=e.results[i][0].transcript.trim(); if(c) chatAccumulated=chatAccumulated?chatAccumulated+' '+c:c; }
      else interim+=e.results[i][0].transcript;
    }
    document.getElementById('chat-input').value=chatAccumulated+(interim?(chatAccumulated?' ':'')+interim:'');
    chatAutoResize();
  };
  r.onend=()=>{ if(isChatRecording){try{chatRecognition.start();}catch{}} };
  r.onerror=(e)=>{ if(e.error==='aborted'||e.error==='no-speech')return; stopChatRecording(); };
  return r;
}
function startChatRecording() {
  chatAccumulated='';
  document.getElementById('chat-input').value='';
  chatRecognition=createChatRecognition();
  if(!chatRecognition)return;
  isChatRecording=true;
  document.getElementById('chat-mic').classList.add('recording');
  try{chatRecognition.start();}catch{}
}
function stopChatRecording() {
  isChatRecording=false;
  document.getElementById('chat-mic').classList.remove('recording');
  if(chatRecognition){try{chatRecognition.stop();}catch{} chatRecognition=null;}
}
function toggleChatRecording() {
  if(isChatRecording){
    stopChatRecording();
    setTimeout(()=>{
      const text=document.getElementById('chat-input').value.trim();
      if(text){document.getElementById('chat-input').value='';chatAutoResize();sendChatMessage(text);}
    },150);
  } else { startChatRecording(); }
}
function chatAutoResize() {
  const ta=document.getElementById('chat-input');
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,120)+'px';
}
document.getElementById('chat-mic').addEventListener('click',toggleChatRecording);
document.getElementById('chat-send').addEventListener('click',()=>{
  const text=document.getElementById('chat-input').value.trim();
  if(!text)return;
  document.getElementById('chat-input').value='';
  chatAutoResize();
  sendChatMessage(text);
});
document.getElementById('chat-input').addEventListener('input',chatAutoResize);
document.getElementById('chat-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chat-send').click();}
});


loadCustomPrompt();
loadChatHistory();
loadNotes();
</script>
