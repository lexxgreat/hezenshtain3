<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hazenstein</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060918;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh;overflow-x:hidden}

.phone{
  width:100%;max-width:430px;height:100vh;height:100dvh;background:#07091A;
  border-radius:0;border:none;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:none;
}
@media(min-width:500px){
  .phone{width:390px;height:844px;border-radius:48px;border:1px solid rgba(108,71,255,0.25);box-shadow:0 0 0 1px rgba(0,0,0,0.9),0 40px 80px rgba(0,0,0,0.8),0 0 100px rgba(108,71,255,0.08);}
  body{align-items:center}
}

/* orbs */
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:orbF 9s ease-in-out infinite}
@keyframes orbF{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}

/* status */
.status{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;font-size:12px;font-weight:600;color:rgba(255,255,255,0.8);position:relative;z-index:3;flex-shrink:0}

/* screens */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;position:relative;z-index:2}
.screen.active{display:flex}

/* ── MAIN SCREEN ── */
.main-top{text-align:center;padding:10px 24px 14px;flex-shrink:0}
.main-logo{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(108,71,255,0.6);font-weight:600;margin-bottom:6px}
.main-greeting{font-size:20px;font-weight:500;color:rgba(255,255,255,0.88);margin-bottom:4px}
.main-sub{font-size:12px;color:rgba(255,255,255,0.35)}

.focus-card{
  margin:0 16px 10px;padding:9px 12px;border-radius:14px;
  background:linear-gradient(135deg, rgba(108,71,255,0.14), rgba(0,212,255,0.08));
  border:1px solid rgba(108,71,255,0.35);flex-shrink:0;
  display:flex;align-items:center;gap:10px;
}
.focus-text{flex:1;font-size:12.5px;color:rgba(255,255,255,0.9);line-height:1.3;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.focus-done-btn{
  flex-shrink:0;padding:6px 12px;border-radius:99px;border:none;background:rgba(0,200,100,0.18);
  color:rgba(0,230,120,0.95);font-size:11.5px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.2s;white-space:nowrap;
}
.focus-done-btn:hover{background:rgba(0,200,100,0.3)}
.focus-next-hint{font-size:10px;color:rgba(255,255,255,0.3);flex-shrink:0;white-space:nowrap;}

.celebrate-overlay{
  position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;
}
.celebrate-check{
  font-size:56px;color:rgba(0,255,140,0.95);width:104px;height:104px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,200,100,0.16);border:2px solid rgba(0,255,140,0.5);
  box-shadow:0 0 50px rgba(0,255,140,0.55), 0 0 100px rgba(0,255,140,0.25);
  animation:celebrateCheckPop 1s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes celebrateCheckPop{
  0%{transform:scale(0);opacity:0}
  45%{transform:scale(1.3);opacity:1}
  65%{transform:scale(0.92);opacity:1}
  85%{transform:scale(1.04);opacity:1}
  100%{transform:scale(1);opacity:0}
}
.celebrate-particle{
  position:absolute;left:50%;top:50%;font-size:22px;
  transform:translate(-50%,-50%) scale(0.5);opacity:1;
  animation:celebrateParticleFly 1s ease-out forwards;
}
@keyframes celebrateParticleFly{
  0%{transform:translate(-50%,-50%) scale(0.5) rotate(0deg);opacity:1;}
  100%{transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(180deg);opacity:0;}
}

/* capture row */
.capture-wrap{margin:0 16px;flex-shrink:0}
.capture-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(108,71,255,0.35);
  border-radius:18px;padding:12px 14px;
  transition:border-color 0.2s;
}
.capture-row:focus-within{border-color:rgba(108,71,255,0.65);box-shadow:0 0 20px rgba(108,71,255,0.1)}
.cap-star{flex-shrink:0}
.cap-input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:15px;color:rgba(255,255,255,0.82);font-family:'Inter',sans-serif;
  line-height:1.5;resize:none;min-height:24px;max-height:50dvh;overflow-y:auto;
}
.cap-input::placeholder{color:rgba(255,255,255,0.22)}
.cap-mic{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.06);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.cap-mic:hover{background:rgba(108,71,255,0.15)}
.cap-mic.recording{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.5);box-shadow:0 0 14px rgba(0,212,255,0.3);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 14px rgba(0,212,255,0.3)}50%{box-shadow:0 0 24px rgba(0,212,255,0.6)}}
.cap-clear{
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.06);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;color:rgba(255,255,255,0.4);
  font-size:16px;line-height:1;
}
.cap-clear.show{display:flex}
.cap-clear:hover{background:rgba(255,80,80,0.15);color:rgba(255,100,100,0.8)}
.cap-send{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(108,71,255,0.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.cap-send:hover{background:rgba(108,71,255,0.45);box-shadow:0 0 16px rgba(108,71,255,0.4)}
.cap-send:active{transform:scale(0.92)}

/* status text under field */
.cap-status{font-size:11px;color:rgba(0,212,255,0.7);text-align:center;margin-top:7px;min-height:16px;transition:opacity 0.3s}

/* quick tags */
.qtags{display:flex;gap:8px;justify-content:center;padding:10px 16px 0;flex-shrink:0;flex-wrap:wrap}
.qtag{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 14px;border-radius:16px;
  border:0.5px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.03);
  cursor:pointer;transition:all 0.2s;min-width:72px;
  font-family:'Inter',sans-serif;
}
.qtag:hover{background:rgba(108,71,255,0.08);border-color:rgba(108,71,255,0.2)}
.qtag-icon{font-size:20px}
.qtag-label{font-size:10px;color:rgba(255,255,255,0.4);font-weight:500}

/* big chaos button */
.chaos-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;min-height:0;max-height:320px;
}
.chaos-glow{
  position:absolute;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(108,71,255,0.22) 0%,rgba(0,212,255,0.06) 55%,transparent 70%);
  filter:blur(24px);pointer-events:none;
  animation:glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

.chaos-rings{position:absolute;width:140px;height:140px}
.cring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(108,71,255,0.1);transform:translate(-50%,-50%);animation:rexp 3s ease-out infinite}
.cring:nth-child(1){width:160px;height:160px;animation-delay:0s}
.cring:nth-child(2){width:195px;height:195px;animation-delay:1s}
.cring:nth-child(3){width:230px;height:230px;animation-delay:2s}
@keyframes rexp{0%{opacity:0.45;transform:translate(-50%,-50%) scale(0.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* wave lines like on reference */
.wave-left,.wave-right{
  position:absolute;top:50%;width:90px;height:60px;
  pointer-events:none;opacity:0.6;
}
.wave-left{left:0;transform:translateY(-50%)}
.wave-right{right:0;transform:translateY(-50%) scaleX(-1)}

.chaos-btn{
  width:130px;height:130px;border-radius:50%;
  border:none;background:transparent;cursor:pointer;
  padding:0;position:relative;z-index:2;
  transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.chaos-btn:hover{transform:scale(1.06)}
.chaos-btn:active{transform:scale(0.94)}

/* flower petals like reference */
.chaos-petals{
  position:absolute;inset:0;border-radius:50%;
  animation:petalSpin 8s linear infinite;
}
@keyframes petalSpin{to{transform:rotate(360deg)}}

.chaos-outer{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#6C47FF,#A855F7,#00D4FF,#6C47FF);
  animation:spinOuter 6s linear infinite;
  filter:blur(1px);
}
@keyframes spinOuter{to{transform:rotate(360deg)}}

.chaos-mid{
  position:absolute;inset:6px;border-radius:50%;
  background:linear-gradient(145deg,#1a0d40,#090618);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 40px rgba(108,71,255,0.3),inset 0 0 80px rgba(0,212,255,0.05);
}

/* inner decorative rings */
.chaos-mid::before{
  content:'';position:absolute;inset:10px;border-radius:50%;
  border:1px solid rgba(108,71,255,0.2);
}
.chaos-mid::after{
  content:'';position:absolute;inset:20px;border-radius:50%;
  border:1px solid rgba(0,212,255,0.15);
}

.chaos-icon{position:relative;z-index:1}

.chaos-hint{margin-top:14px;text-align:center;position:relative;z-index:2}
.chaos-hint-tap{font-size:13px;color:rgba(255,255,255,0.55)}
.chaos-hint-voice{font-size:13px;color:#00D4FF;font-weight:500;margin-top:2px}

/* save feedback */
.save-flash{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(108,71,255,0.9);color:white;
  padding:10px 24px;border-radius:99px;font-size:14px;font-weight:500;
  pointer-events:none;opacity:0;transition:opacity 0.3s;
  backdrop-filter:blur(10px);white-space:nowrap;z-index:10;
}
.save-flash.show{opacity:1}

/* ── HISTORY SCREEN ── */
.hist-header{padding:16px 20px 12px;flex-shrink:0}
.hist-title{font-size:22px;font-weight:600;color:rgba(255,255,255,0.9);letter-spacing:-0.3px}
.hist-sub{font-size:12px;color:rgba(255,255,255,0.3);margin-top:3px}

.hist-search{
  margin:0 16px 12px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:9px 13px;flex-shrink:0;
}
.hist-search input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif}
.hist-search input::placeholder{color:rgba(255,255,255,0.22)}

.hist-filters::-webkit-scrollbar{display:none}
.hist-filter-btn{
  flex-shrink:0;padding:6px 13px;border-radius:99px;border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55);font-size:12px;font-weight:500;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;white-space:nowrap;
}
.hist-filter-btn.active{background:rgba(108,71,255,0.18);border-color:rgba(108,71,255,0.5);color:rgba(139,92,246,0.95)}

.hist-mode-btn{
  flex:1;padding:8px 10px;border-radius:10px;border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:12.5px;font-weight:500;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;
}
.hist-mode-btn.active{background:rgba(0,200,100,0.14);border-color:rgba(0,200,100,0.4);color:rgba(0,220,110,0.9)}

.hist-list{flex:1;overflow-y:auto;padding:0 16px 12px}
.hist-list::-webkit-scrollbar{width:0}

.hist-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.25);font-size:14px}
.hist-empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4}

.note-card{
  background:rgba(255,255,255,0.03);
  border:0.5px solid rgba(255,255,255,0.07);
  border-radius:16px;padding:13px 15px;margin-bottom:8px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:all 0.2s;
}
.note-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(108,71,255,0.2)}
.note-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(to bottom,#6C47FF,#00D4FF);border-radius:99px;
  opacity:0.6;
}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.note-date{font-size:10px;color:rgba(255,255,255,0.28);font-weight:500}
.note-type{font-size:9px;padding:2px 7px;border-radius:99px;font-weight:600}
.type-voice{background:rgba(0,212,255,0.1);color:rgba(0,212,255,0.8);border:0.5px solid rgba(0,212,255,0.2)}
.type-text{background:rgba(108,71,255,0.1);color:rgba(139,92,246,0.8);border:0.5px solid rgba(108,71,255,0.2)}
.note-text{font-size:13.5px;color:rgba(255,255,255,0.72);line-height:1.5;word-break:break-word}
.note-actions{display:flex;gap:8px;margin-top:10px;opacity:1;flex-wrap:wrap;}

.note-btn{
  font-size:11px;padding:4px 12px;border-radius:99px;border:none;
  cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all 0.2s;
}
.todo-drag-handle{
  cursor:grab;padding:6px 4px;color:rgba(255,255,255,0.28);font-size:18px;
  touch-action:none;user-select:none;flex-shrink:0;line-height:1;margin-top:2px;
}
.todo-dragging{
  opacity:0.9;box-shadow:0 10px 28px rgba(0,0,0,0.5);z-index:20;transition:none !important;
}
.note-edit{background:rgba(108,71,255,0.15);color:rgba(139,92,246,0.9)}
.note-edit:hover{background:rgba(108,71,255,0.3)}
.note-done{background:rgba(0,200,100,0.12);color:rgba(0,220,110,0.85);border:0.5px solid rgba(0,200,100,0.25)}
.note-done:hover{background:rgba(0,200,100,0.25)}
.note-undone{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:0.5px solid rgba(255,255,255,0.1)}
.note-undone:hover{background:rgba(255,255,255,0.1)}
.note-del{background:rgba(255,80,80,0.1);color:rgba(255,100,100,0.8)}
.note-del:hover{background:rgba(255,80,80,0.25)}

/* edit modal */
.modal-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(5,8,20,0.85);backdrop-filter:blur(10px);
  z-index:20;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:#0F1228;border:0.5px solid rgba(108,71,255,0.3);
  border-radius:24px;padding:20px;width:100%;
  box-shadow:0 0 60px rgba(108,71,255,0.15);
}
.modal-title{font-size:16px;font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:14px}
.modal-textarea{
  width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:13px;color:rgba(255,255,255,0.82);
  font-size:14px;font-family:'Inter',sans-serif;line-height:1.55;
  resize:none;outline:none;min-height:120px;
}
.modal-textarea:focus{border-color:rgba(108,71,255,0.4)}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-cancel{flex:1;padding:10px;border-radius:12px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.45);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.modal-save{flex:1;padding:10px;border-radius:12px;border:0.5px solid rgba(108,71,255,0.4);background:rgba(108,71,255,0.2);color:rgba(139,92,246,0.95);font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.modal-save:hover{background:rgba(108,71,255,0.4);color:#fff}

/* ── DOCK ── */
.dock{
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 8px 26px;
  background:rgba(255,255,255,0.02);
  border-top:0.5px solid rgba(255,255,255,0.06);
  flex-shrink:0;position:relative;z-index:3;
}
.dock-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;padding:7px 10px;border-radius:16px;
  background:transparent;border:none;font-family:'Inter',sans-serif;
  position:relative;transition:all 0.2s;
}
.dock-item svg{width:24px;height:24px;color:rgba(255,255,255,0.28);transition:all 0.2s}
.dock-item span{font-size:10px;color:rgba(255,255,255,0.22);font-weight:500;transition:all 0.2s}
.dock-item.active svg{color:#8B5CF6;filter:drop-shadow(0 0 6px rgba(108,71,255,0.8))}
.dock-item.active span{color:rgba(139,92,246,0.75)}
.dock-item.active::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#6C47FF;box-shadow:0 0 6px #6C47FF}

/* ── CHAT SCREEN ── */
.chat-header{padding:16px 20px 10px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6C47FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-title-wrap{flex:1}
.chat-title{font-size:16px;font-weight:600;color:rgba(255,255,255,0.9)}
.chat-subtitle{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}
.chat-clear-btn{padding:5px 12px;border-radius:99px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.chat-clear-btn:hover{border-color:rgba(255,80,80,0.3);color:rgba(255,100,100,0.6)}

.chat-messages{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.chat-messages::-webkit-scrollbar{width:0}

.chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;word-break:break-word;position:relative}
.bubble-user{align-self:flex-end;background:rgba(108,71,255,0.25);border:0.5px solid rgba(108,71,255,0.35);color:rgba(255,255,255,0.88);border-bottom-right-radius:5px}
.bubble-ai{align-self:flex-start;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.8);border-bottom-left-radius:5px}
.bubble-time{font-size:9px;color:rgba(255,255,255,0.25);margin-top:5px;text-align:right}
.bubble-ai .bubble-time{text-align:left}

.bubble-confirm{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.confirm-btn{padding:5px 13px;border-radius:99px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;transition:all 0.2s}
.confirm-yes{background:rgba(108,71,255,0.3);color:rgba(139,92,246,0.95);border:0.5px solid rgba(108,71,255,0.4)}
.confirm-yes:hover{background:rgba(108,71,255,0.5)}
.confirm-no{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);border:0.5px solid rgba(255,255,255,0.1)}
.confirm-no:hover{background:rgba(255,80,80,0.12);color:rgba(255,100,100,0.7)}

.bubble-typing{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:rgba(108,71,255,0.6);animation:typingBounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, orderBy, query, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAm5Sr2UO0PfKMe3YFkQ_XsWonKUMGDOKo",
  authDomain: "hezenshtain-3eb60.firebaseapp.com",
  projectId: "hezenshtain-3eb60",
  storageBucket: "hezenshtain-3eb60.firebasestorage.app",
  messagingSenderId: "127819867710",
  appId: "1:127819867710:web:b5b6d33f0e8db482e0936f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const notesCol = collection(db, "notes");
const chatCol = collection(db, "chat");
const promptRulesCol = collection(db, "promptRules");

let promptRules = []; // [{id, text, createdAt, source}]

async function loadPromptRules() {
  try {
    const q = query(promptRulesCol, orderBy('createdAt', 'asc'));
    const snap = await getDocs(q);
    promptRules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.error('prompt rules load error', e); }
}

async function addPromptRule(text, source) {
  if (!text.trim()) return;
  try {
    const ref = await addDoc(promptRulesCol, { text: text.trim(), source: source || 'manual', createdAt: new Date().toISOString() });
    promptRules.push({ id: ref.id, text: text.trim(), source: source || 'manual', createdAt: new Date().toISOString() });
    renderPromptRules();
  } catch(e) { console.error('prompt rule add error', e); alert('Не удалось сохранить правило: ' + e.message + '\n\nПроверь правила доступа Firestore для коллекции "promptRules"'); }
}

async function deletePromptRule(id) {
  try {
    await deleteDoc(doc(db, 'promptRules', id));
    promptRules = promptRules.filter(r => r.id !== id);
    renderPromptRules();
  } catch(e) { console.error('prompt rule delete error', e); }
}
window.deletePromptRule = deletePromptRule;

function renderPromptRules() {
  const el = document.getElementById('prompt-list');
  if (!el) return;
  document.getElementById('prompt-count').textContent = promptRules.length + ' правил';

  const baseBlock = `
    <details style="margin-bottom:16px;">
      <summary style="cursor:pointer;color:rgba(255,255,255,0.5);font-size:12.5px;padding:8px 0;">📋 Базовая инструкция (только просмотр)</summary>
      <div class="note-card" style="margin-top:8px;">
        <div class="note-text" style="white-space:pre-wrap;font-size:12.5px;">${escHtml(getBaseInstructions())}</div>
      </div>
    </details>
    <div style="color:rgba(255,255,255,0.35);font-size:11px;padding:0 0 10px;">Твои личные дополнения (можно удалять):</div>
  `;

  if (!promptRules.length) {
    el.innerHTML = baseBlock + '<div class="hist-empty"><div class="hist-empty-icon">📝</div>Пока нет дополнений к промпту</div>';
    return;
  }
  el.innerHTML = baseBlock + promptRules.map(r => `
    <div class="note-card">
      <div class="note-meta">
        <span class="note-date">${r.source === 'chat' ? '💬 из чата' : '✍️ вручную'}</span>
      </div>
      <div class="note-text">${r.text}</div>
      <div class="note-actions">
        <button class="note-btn note-undone" onclick="deletePromptRule('${r.id}')">✕ Удалить</button>
      </div>
    </div>
  `).join('');
}
window.renderPromptRules = renderPromptRules;

let notes = [];
let editingId = null;
let activeTag = null;

// ── ТЕГИ (единый источник для главного экрана и ИИ в чате) ──
const tagsCol = collection(db, "tags");
let tags = []; // [{id, label, icon, createdAt}]

const DEFAULT_TAGS = [
  { label: 'Такси', icon: '🚕' },
  { label: 'Работа', icon: '📢' },
  { label: 'Хэзэнштейн', icon: '💻' },
  { label: 'Семья', icon: '👨‍👩‍👧' },
  { label: 'Здоровье', icon: '🧠' },
  { label: 'Быт', icon: '🏠' },
  { label: 'Мысли', icon: '💭' }
];

async function loadTags() {
  try {
    const q = query(tagsCol, orderBy('createdAt', 'asc'));
    const snap = await getDocs(q);
    tags = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Сидирование дефолтных тегов — гарантированно один раз (флаг в meta),
    // устойчиво к обрыву посреди загрузки, и НЕ восстанавливает теги,
    // которые пользователь сознательно удалил после завершённого сидирования.
    const metaSnap = await getDocs(collection(db, 'meta'));
    const seedFlag = metaSnap.docs.find(d => d.id === 'tags_seed');
    if (!seedFlag || seedFlag.data().done !== true) {
      const existingLabels = new Set(tags.map(t => t.label));
      for (const t of DEFAULT_TAGS) {
        if (!existingLabels.has(t.label)) {
          await addTag(t.label, t.icon);
        }
      }
      await setDoc(doc(db, 'meta', 'tags_seed'), { done: true });
    }
  } catch(e) {
    console.error('tags load error', e);
    const el = document.getElementById('tags-list');
    if (el) el.innerHTML = '<div class="hist-empty">⚠️ Ошибка загрузки тегов: ' + e.message + '<br>Проверь правила доступа Firestore для коллекции "tags"</div>';
  }
}

async function addTag(label, icon) {
  if (!label.trim()) return;
  try {

    renderQuickTags();

}

// ── РЕЧЬ ──
let recognition = null;
let isRecording = false;
let accumulated = ''; // финальный накопленный текст

function getSR() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}

function createRecognition() {
  const SR = getSR();
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ru-RU';
  r.continuous = false;      // без continuous — нет дублей и нет потери пробелов
  r.interimResults = true;

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const chunk = e.results[i][0].transcript.trim();
        if (chunk) {
          accumulated = accumulated ? accumulated + ' ' + chunk : chunk;
        }
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const display = accumulated + (interim ? (accumulated ? ' ' : '') + interim : '');
    document.getElementById('cap-input').value = display;
    autoResize();
    showClear();
  };

  r.onend = () => {
    // автоперезапуск, пока пользователь не нажал стоп
    if (isRecording) {
      try { recognition.start(); } catch(err) {}
    }
  };

  r.onerror = (e) => {
    if (e.error === 'aborted') return;
    if (e.error === 'no-speech') return; // тихо — просто ждём
    stopRecording();
  };

  return r;
}

function startRecording() {
  if (!getSR()) { setStatus('Голосовой ввод не поддерживается'); return; }

  accumulated = '';
  document.getElementById('cap-input').value = '';
  autoResize();

  recognition = createRecognition();
  if (!recognition) return;

  isRecording = true;
  setMicState(true);
  setStatus('🎤 Говорите...');
  try { recognition.start(); } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  setMicState(false);
  setStatus('');
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
    // небольшая пауза чтобы финальный результат успел записаться в поле
    setTimeout(() => {
      const text = document.getElementById('cap-input').value.trim();
      if (text) saveNote(text, 'voice');
    }, 150);
  } else {
    startRecording();
  }
}

function setMicState(on) {
  const mic = document.getElementById('cap-mic');
  const chaos = document.getElementById('chaos-btn');
  if (on) {
    mic.classList.add('recording');
    chaos.style.filter = 'drop-shadow(0 0 20px rgba(0,212,255,0.9))';
  } else {
    mic.classList.remove('recording');
    chaos.style.filter = '';
  }
}

async function loadNotes() {
  try {
    const q = query(notesCol, orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    filterNotes(); // рендерим с учётом активного фильтра по дате/поиску
    renderTodo(); // тудушка всегда синхронна с общей базой записей
    renderFocusCard(); // карточка "сейчас важно" на главном экране тоже
  } catch(e) {
    document.getElementById('hist-list').innerHTML = '<div class="hist-empty"><div>⚠️</div>Ошибка загрузки</div>';
  }
}

function renderNotes(list) {
  const el = document.getElementById('hist-list');

    return;
  }
  el.innerHTML = list.map(n => {
    // UTC+3 Moscow time
    const d = new Date(new Date(n.createdAt).getTime() + 3*60*60*1000);

    const isDone = n.done === true;

    const cardStyle = (isDone ? 'opacity:0.5;' : '') + (isSelected ? 'border-color:rgba(139,92,246,0.7);background:rgba(108,71,255,0.1);' : '');
    const textStyle = isDone ? 'text-decoration:line-through;color:rgba(255,255,255,0.4);' : '';
    let doneAtStr = '';
    if (isDone && n.doneAt) {
      const dd = new Date(new Date(n.doneAt).getTime() + 3*60*60*1000);
      doneAtStr = ' · ✓ ' + dd.toLocaleDateString('ru-RU', { day:'numeric', month:'short', timeZone:'UTC' }) + ' ' + dd.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', timeZone:'UTC' });
    }
    const cardClick = selectionMode ? `onclick="toggleSelectNote('${n.id}')" style="cursor:pointer;${cardStyle}"` : `style="${cardStyle}"`;
    const checkbox = selectionMode ? `<div style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${isSelected?'rgba(139,92,246,0.9)':'rgba(255,255,255,0.25)'};background:${isSelected?'rgba(139,92,246,0.9)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff;">${isSelected?'✓':''}</div>` : '';
    // MVP: кнопка "Выполнено" доступна для ЛЮБОЙ записи, а не только с тегом "Задача"
    const doneBtn = `<button class="note-btn ${isDone ? 'note-undone' : 'note-done'}" onclick="toggleDone('${n.id}', ${isDone})">${isDone ? '↩ Открыть' : '✓ Выполнено'}</button>`;
    const isInTodo = n.inTodo === true;
    const todoBtn = `<button class="note-btn ${isInTodo ? 'note-undone' : 'note-edit'}" onclick="toggleTodo('${n.id}', ${isInTodo})">${isInTodo ? '✕ Убрать из тудулиста' : '➜ В тудулист'}</button>`;
    return `
      <div class="note-card" ${cardClick}>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          ${checkbox}

              <span class="note-date">${date} · ${time}${n.tag ? ' · ' + n.tag : ''}${doneAtStr}</span>
              <span class="note-type ${n.type === 'voice' ? 'type-voice' : 'type-text'}">${n.type === 'voice' ? '🎤 Голос' : '✏️ Текст'}</span>

            <div class="note-actions">

              <button class="note-btn note-del" onclick="deleteNote('${n.id}')">Удалить</button>
            </div>`}
          </div>
        </div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let histFilter = 'all';
let histMode = 'added'; // 'added' — по дате создания, 'done' — по дате отметки Выполнено

// возвращает дату записи как календарный день в московском времени (UTC+3)
function toMoscowDayStart(iso) {
  const d = new Date(new Date(iso).getTime() + 3*60*60*1000);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function matchesDateFilter(note, filter, mode) {
  const dateField = mode === 'done' ? note.doneAt : note.createdAt;
  if (mode === 'done' && !dateField) return false; // не выполнено — не показываем в режиме "Выполнено"
  if (filter === 'all') return true;
  const noteDay = toMoscowDayStart(dateField);
  const todayDay = toMoscowDayStart(new Date().toISOString());
  const dayMs = 24*60*60*1000;
  if (filter === 'today') return noteDay === todayDay;
  if (filter === 'yesterday') return noteDay === todayDay - dayMs;
  if (filter === 'week') return noteDay >= todayDay - 6*dayMs; // сегодня + 6 предыдущих = 7 дней
  if (filter === 'month') return noteDay >= todayDay - 29*dayMs; // последние 30 дней
  return true;
}

function setHistFilter(filter) {
  histFilter = filter;
  document.querySelectorAll('.hist-filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);

  try {

    const minOrder = notes.reduce((m, n) => n.inTodo ? Math.min(m, n.todoOrder ?? Infinity) : m, Infinity);
    let base = minOrder === Infinity ? 0 : minOrder - ids.length - 1;
    for (const id of ids) {
      base += 1;
      await updateDoc(doc(db, 'notes', id), { inTodo: true, todoOrder: base });
    }
    selectedNoteIds.clear();
    toggleSelectionMode();
    await loadNotes();
  } catch(e) { alert('Ошибка: ' + e.message); }

async function toggleTodo(id, currentInTodo) {

// ── ЖЕСТ "Х" НА ГЛАВНОМ ЭКРАНЕ — перечеркнул весь экран крест-накрест = отметил текущую задачу выполненной ──
// Порядок диагоналей не важен: сначала ловим один диагональный штрих, потом второй (в любом порядке,
// "\" или "/"), проверяем что они пересекаются в одной области экрана и уложились в разумное время.
let xGestureStroke = null; // {startX, startY, time}
let xGestureHistory = []; // [{type:'slash'|'backslash', midX, midY, time}]

function xGestureStart(x, y) {
  xGestureStroke = { startX: x, startY: y, time: Date.now() };
}

function xGestureEnd(x, y) {
  if (!xGestureStroke) return;
  const { startX, startY } = xGestureStroke;
  xGestureStroke = null;

  const mainEl = document.getElementById('screen-main');
  if (!mainEl || !mainEl.classList.contains('active')) return;

  const dx = x - startX;
  const dy = y - startY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const minSide = Math.min(mainEl.clientWidth, mainEl.clientHeight);

  if (dist < minSide * 0.5) return; // слишком короткий штрих — не считаем частью "Х"

  const ratio = Math.abs(dx) / (Math.abs(dy) || 1);
  if (ratio < 0.4 || ratio > 2.5) return; // недостаточно диагонально (слишком гориз./вертик.)

  const type = (dx * dy > 0) ? 'backslash' : 'slash'; // "\" или "/", направление свайпа не важно
  const midX = (startX + x) / 2;
  const midY = (startY + y) / 2;
  const now = Date.now();

  xGestureHistory = xGestureHistory.filter(s => now - s.time < 1200); // храним штрихи не старше 1.2с
  xGestureHistory.push({ type, midX, midY, time: now });

  const crossTolerance = minSide * 0.4;
  const match = xGestureHistory.find(s =>
    s.type !== type &&
    Math.abs(s.midX - midX) < crossTolerance &&
    Math.abs(s.midY - midY) < crossTolerance
  );

  if (match) {
    xGestureHistory = [];
    completeFocusTaskByGesture();
  }
}

function completeFocusTaskByGesture() {
  const queue = getTodoQueue();
  if (!queue.length) return; // нет активной задачи — жест ни на что не влияет
  const top = queue[0];
  toggleDone(top.id, false); // celebrateTaskDone() вызовется внутри toggleDone
}

// ── DRAG-N-DROP ДЛЯ ТУДУШКИ ──
// Тащим за ручку "⠿", отпускаем — задача встаёт на позицию под пальцем.
// Слушатель вешаем один раз на статичный контейнер #todo-list (сам список,
// а не его содержимое, которое перерисовывается) — переживает любые re-render.
let todoDragState = null;

function initTodoDrag() {
  const listEl = document.getElementById('todo-list');
  if (!listEl || listEl.dataset.dragInit) return;
  listEl.dataset.dragInit = '1';

  const EDGE = 60; // зона у края списка, при заходе в которую начинаем автоскролл (px)
  const MAX_SPEED = 14; // максимальная скорость автоскролла (px за кадр)

  function updateDragVisual() {
    if (!todoDragState) return;
    const scrolled = listEl.scrollTop - todoDragState.startScrollTop;
    const deltaY = todoDragState.lastClientY - todoDragState.startY + scrolled;
    todoDragState.itemEl.style.transform = `translateY(${deltaY}px)`;
  }

  function autoScrollTick() {
    if (!todoDragState) return;
    const rect = listEl.getBoundingClientRect();
    const y = todoDragState.lastClientY;
    let speed = 0;
    if (y < rect.top + EDGE) {
      speed = -MAX_SPEED * (1 - Math.max(0, (y - rect.top)) / EDGE);
    } else if (y > rect.bottom - EDGE) {
      speed = MAX_SPEED * (1 - Math.max(0, (rect.bottom - y)) / EDGE);
    }
    if (speed !== 0) {
      listEl.scrollTop += speed;
      updateDragVisual();
    }
    todoDragState.rafId = requestAnimationFrame(autoScrollTick);
  }

  listEl.addEventListener('touchstart', (e) => {
    const handle = e.target.closest('.todo-drag-handle');
    if (!handle) return;
    const card = handle.closest('.note-card');
    if (!card) return;
    const touch = e.touches[0];
    const items = Array.from(listEl.querySelectorAll('.note-card'));
    const itemsSnapshot = items.map(elm => {
      const r = elm.getBoundingClientRect();
      return { id: elm.dataset.id, midY: r.top + r.height / 2 };
    });
    todoDragState = {
      id: card.dataset.id, startY: touch.clientY, lastClientY: touch.clientY,
      itemEl: card, itemsSnapshot, startScrollTop: listEl.scrollTop
    };
    card.classList.add('todo-dragging');
    todoDragState.rafId = requestAnimationFrame(autoScrollTick);
  }, { passive: true });

  listEl.addEventListener('touchmove', (e) => {
    if (!todoDragState) return;
    e.preventDefault(); // не даём странице скроллиться обычным способом во время перетаскивания
    todoDragState.lastClientY = e.touches[0].clientY;
    updateDragVisual();
  }, { passive: false });

  function finishDrag(finalClientY) {
    if (!todoDragState) return;
    cancelAnimationFrame(todoDragState.rafId);
    // компенсируем итоговый скролл при сравнении с исходными позициями соседей
    const scrolled = listEl.scrollTop - todoDragState.startScrollTop;
    const others = todoDragState.itemsSnapshot.filter(s => s.id !== todoDragState.id);
    let newIndex = others.length;
    for (let i = 0; i < others.length; i++) {
      const adjustedMidY = others[i].midY - scrolled;
      if (finalClientY < adjustedMidY) { newIndex = i; break; }
    }
    todoDragState.itemEl.style.transform = '';
    todoDragState.itemEl.classList.remove('todo-dragging');
    reorderTodo(todoDragState.id, newIndex);
    todoDragState = null;
  }

  listEl.addEventListener('touchend', (e) => {
    if (!todoDragState) return;
    finishDrag(e.changedTouches[0].clientY);
  });

  listEl.addEventListener('touchcancel', () => {
    if (!todoDragState) return;
    cancelAnimationFrame(todoDragState.rafId);
    todoDragState.itemEl.style.transform = '';
    todoDragState.itemEl.classList.remove('todo-dragging');
    todoDragState = null;
  });
}

async function reorderTodo(id, newIndex) {
  const queue = getTodoQueue();
  const dragged = queue.find(n => n.id === id);
  if (!dragged) return;
  const rest = queue.filter(n => n.id !== id);
  rest.splice(newIndex, 0, dragged);
  try {
    for (let i = 0; i < rest.length; i++) {
      await updateDoc(doc(db, 'notes', rest[i].id), { todoOrder: i + 1 });
    }
    await loadNotes();
  } catch(e) { alert('Ошибка сортировки: ' + e.message); }
}

window.resolveConfirm = async function(idx, yes) {
  const m = chatHistory[idx];

  m.confirmData.resolved = true;
  if (yes) {
    const nd = m.confirmData.note;
    try {
      await addDoc(notesCol, {
        text: nd.text, type: 'text',
        tag: nd.tag || null,
        createdAt: new Date().toISOString()
      });
      await addChatMessage('assistant', '✅ Добавлено в базу!');
      await loadNotes();

  } else {

  }
  renderChat();
};

function toMoscow(isoStr) {
  const d = new Date(isoStr);
  // UTC+3
  d.setTime(d.getTime() + 3 * 60 * 60 * 1000);
  const day = String(d.getUTCDate()).padStart(2,'0');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const mon = months[d.getUTCMonth()];
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  return `${day} ${mon} ${h}:${m}`;
}

async function sendChatMessage(userText) {
  if (!userText.trim()) return;

  // проверяем: есть ли pending confirm и пользователь отвечает «да»
  const lastAI = [...chatHistory].reverse().find(m => m.role === 'assistant' && m.confirmData && !m.confirmData.resolved);
  const normalized = userText.trim().toLowerCase().replace(/[.,!?\s]+$/g, '');
  if (lastAI && /^(да|добавь|добавить|ок|окей|okay|yes|ага|угу|давай|подтверждаю)(\s.*)?$/i.test(normalized)) {
    await addChatMessage('user', userText);
    await resolveConfirm(chatHistory.indexOf(lastAI), true);
    return;
  }
  if (lastAI && /^(нет|не надо|не добавляй|отмена|no|не нужно)(\s.*)?$/i.test(normalized)) {
    await addChatMessage('user', userText);
    await resolveConfirm(chatHistory.indexOf(lastAI), false);
    return;
  }

  await addChatMessage('user', userText);
  const apiMessages = [
    { role:'system', content: buildSystemPrompt() },
    ...chatHistory.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,content:m.content}))
  ];
  showTyping();
  document.getElementById('chat-subtitle').textContent = 'Думаю...';
  try {
    const res = await fetch(POLZA_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+POLZA_KEY},
      body: JSON.stringify({
        model: CHAT_MODEL, max_tokens: 700, messages: apiMessages,
        tools: buildChatTools(), tool_choice: 'auto'
      })
    });
    const data = await res.json();
    hideTyping();
    document.getElementById('chat-subtitle').textContent = 'Готов помочь';

    const message = data.choices?.[0]?.message;
    if (!message) { await addChatMessage('assistant', 'Нет ответа'); return; }

    const toolCalls = message.tool_calls || [];
    let proposedNote = null;
    let doneTarget = null;
    let promptRule = null;

    for (const call of toolCalls) {
      let args = {};
      try { args = JSON.parse(call.function.arguments || '{}'); } catch(e) {}
      if (call.function.name === 'propose_note' && !proposedNote) {
        proposedNote = args; // берём только первую предложенную запись за раз
      } else if (call.function.name === 'mark_done' && !doneTarget) {
        doneTarget = args.task_text;
      } else if (call.function.name === 'update_prompt' && !promptRule) {
        promptRule = args.rule;
      }
    }

    // выполнение отметки задачи выполненной — сразу, без подтверждения (как и раньше)
    if (doneTarget) {
      const task = notes.find(n => n.text.toLowerCase().includes(doneTarget.toLowerCase()) && !n.done);
      if (task) {
        await updateDoc(doc(db, 'notes', task.id), { done: true, doneAt: new Date().toISOString() });
        await loadNotes();
      }
    }

    // обновление промпта — добавляем как отдельную строку (модель вызывает только после подтверждения по инструкции)
    if (promptRule) {
      await addPromptRule(promptRule, 'chat');
    }

    const replyText = (message.content || '').trim();

    if (proposedNote && proposedNote.text) {
      const validTags = tags.map(t => t.label);
      const tag = validTags.includes(proposedNote.tag) ? proposedNote.tag : null;
      const confirmText = (replyText ? replyText + '\n\n' : '') +
        'Добавить в базу: «' + proposedNote.text + '»' + (tag ? ' [' + tag + ']' : '') + '?';
      await addChatMessage('assistant', confirmText, { note: { text: proposedNote.text, tag }, resolved: false });
    } else {
      await addChatMessage('assistant', replyText || 'Хорошо.');
    }
  } catch(e) {
    hideTyping();
    document.getElementById('chat-subtitle').textContent = 'Готов помочь';
    await addChatMessage('assistant','Ошибка соединения: '+e.message);
  }
}

function checkRemindersOnOpen() {
  if (!notes.length) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = notes.filter(n => {
    if (n.tag!=='Reminder') return false;
    const dm = n.text.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/);
    if (!dm) return false;
    const year = dm[3]?parseInt(dm[3]):today.getFullYear();
    const d = new Date(year, parseInt(dm[2])-1, parseInt(dm[1]));
    d.setHours(0,0,0,0);
    return d<=today;
  });
  if (due.length>0) {
    addChatMessage('assistant','⏰ Привет! Напоминания на сегодня:\n\n'+due.map(r=>'• '+r.text).join('\n'));
  } else if (chatHistory.length===0) {
    addChatMessage('assistant','Привет, Алексей! 👋 Спроси меня что угодно — покажу что в базе, помогу разобрать записи или поставить задачу.');
  }
}

window.clearChatHistory = async function() {
  if (!confirm('Очистить историю чата?')) return;
  await deleteChatHistory();
  chatHistory = [];
  renderChat();
};

// экспорт заметок
window.exportNotes = async function() {
  try {
    const q = query(notesCol, orderBy('createdAt','asc'));
    const snap = await getDocs(q);
    const data = snap.docs.map(d => d.data());
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hazenstein_notes_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('Ошибка экспорта: ' + e.message); }
};

// голос в чате
function createChatRecognition() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang='ru-RU'; r.continuous=false; r.interimResults=true;
  r.onresult = (e) => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      if (e.results[i].isFinal) { const c=e.results[i][0].transcript.trim(); if(c) chatAccumulated=chatAccumulated?chatAccumulated+' '+c:c; }
      else interim+=e.results[i][0].transcript;
    }
    document.getElementById('chat-input').value=chatAccumulated+(interim?(chatAccumulated?' ':'')+interim:'');
    chatAutoResize();
  };
  r.onend=()=>{ if(isChatRecording){try{chatRecognition.start();}catch{}} };
  r.onerror=(e)=>{ if(e.error==='aborted'||e.error==='no-speech')return; stopChatRecording(); };
  return r;
}
function startChatRecording() {
  chatAccumulated='';
  document.getElementById('chat-input').value='';
  chatRecognition=createChatRecognition();
  if(!chatRecognition)return;
  isChatRecording=true;
  document.getElementById('chat-mic').classList.add('recording');
  try{chatRecognition.start();}catch{}
}
function stopChatRecording() {
  isChatRecording=false;
  document.getElementById('chat-mic').classList.remove('recording');
  if(chatRecognition){try{chatRecognition.stop();}catch{} chatRecognition=null;}
}
function toggleChatRecording() {
  if(isChatRecording){
    stopChatRecording();
    setTimeout(()=>{
      const text=document.getElementById('chat-input').value.trim();
      if(text){document.getElementById('chat-input').value='';chatAutoResize();sendChatMessage(text);}
    },150);
  } else { startChatRecording(); }
}
function chatAutoResize() {
  const ta=document.getElementById('chat-input');
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,120)+'px';
}
document.getElementById('chat-mic').addEventListener('click',toggleChatRecording);
document.getElementById('chat-send').addEventListener('click',()=>{
  const text=document.getElementById('chat-input').value.trim();
  if(!text)return;
  document.getElementById('chat-input').value='';
  chatAutoResize();
  sendChatMessage(text);
});
document.getElementById('chat-input').addEventListener('input',chatAutoResize);
document.getElementById('chat-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chat-send').click();}
});

document.getElementById('prompt-add-btn').addEventListener('click', () => {
  const input = document.getElementById('prompt-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addPromptRule(text, 'manual');
});
document.getElementById('prompt-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('prompt-add-btn').click(); }
});

document.getElementById('tag-add-btn').addEventListener('click', () => {
  const input = document.getElementById('tag-input');
  const raw = input.value.trim();
  if (!raw) return;
  input.value = '';
  // "🚕 Такси" → иконка + название; "Такси" → иконка по умолчанию
  const parts = raw.split(/\s+/);
  let icon = '🏷️', label = raw;
  if (parts.length > 1 && /^\p{Extended_Pictographic}/u.test(parts[0])) {
    icon = parts[0];
    label = parts.slice(1).join(' ');
  }
  addTag(label, icon);
});
document.getElementById('tag-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('tag-add-btn').click(); }
});

// ── Жест "Х" на главном экране ──
const mainScreenEl = document.getElementById('screen-main');
mainScreenEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  xGestureStart(t.pageX, t.pageY);
}, { passive: true });
mainScreenEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  xGestureEnd(t.pageX, t.pageY);
}, { passive: true });
// mouse-фолбэк для теста в браузере без тачскрина
let xMouseDown = false;
mainScreenEl.addEventListener('mousedown', (e) => { xMouseDown = true; xGestureStart(e.pageX, e.pageY); });
mainScreenEl.addEventListener('mouseup', (e) => { if (xMouseDown) { xMouseDown = false; xGestureEnd(e.pageX, e.pageY); } });

initTodoDrag();
loadPromptRules().then(renderPromptRules);
loadTags().then(() => { renderQuickTags(); renderTagsScreen(); });
loadChatHistory();
loadNotes();
</script>
